buildscript {
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT' }
}
apply plugin: 'forge'
version = '0.1.0'
group = 'com.zenovka.entitygovernor'
archivesBaseName = 'EntityGovernor'
sourceCompatibility = targetCompatibility = '1.7'
minecraft { version = '1.7.10-10.13.4.1614-1.7.10'; runDir = 'run' }
processResources { from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand 'version': project.version }; from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' } }
